# ByteTrack with a longer lost-track buffer, for the ball-tracking benchmark.
# Identical to Ultralytics' default bytetrack.yaml except track_buffer (30 -> 120).
# At stride 1 on 60 fps video, 120 frames = 2 s; the default 30 frames = 0.5 s.

tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 120 # frames to keep lost tracks alive
match_thresh: 0.8
fuse_score: True
